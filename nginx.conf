server {
    listen 80;
    server_name littlelemon;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name littlelemon;

    # NOTE:
    # The following SSL certificate and key files must exist at the specified paths.
    # If they do not exist, NGINX will fail to start.
    # To generate a self-signed certificate for development, you can use:
    #   mkdir -p /etc/nginx/ssl
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/nginx/ssl/private.key -out /etc/nginx/ssl/public.crt \
    #     -subj "/CN=localhost"
    # For production, use certificates from a trusted Certificate Authority.
    ssl_certificate /etc/nginx/ssl/public.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'HIGH:!aNULL:!MD5';
    ssl_prefer_server_ciphers on;
    location / {
        proxy_pass http://littlelemon:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
